name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: clip-pipeline validate examples/project.json
      - run: clip-pipeline plan
      - run: clip-pipeline demo
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-demo
          path: output/synthetic-demo.mp4
